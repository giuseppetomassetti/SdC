<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
  <title id="title">Ascissa curvilinea sulla parabola</title>
  <desc id="desc">Arco di parabola con il tratto dal vertice al punto di parametro un mezzo evidenziato nel verso del parametro crescente.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#244b62"/>
    </marker>
    <marker id="arc-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45532"/>
    </marker>
  </defs>

  <rect width="680" height="430" rx="18" fill="#efe6d7"/>

  <g fill="none" stroke="#244b62" stroke-width="4" stroke-linecap="round">
    <path d="M55 350 H630" marker-end="url(#axis-arrow)"/>
    <path d="M340 390 V35" marker-end="url(#axis-arrow)"/>
  </g>

  <path d="M105 115 Q340 585 575 115"
        fill="none" stroke="#6d7d87" stroke-width="8" stroke-linecap="round"/>
  <circle cx="105" cy="115" r="10" fill="#efe6d7" stroke="#6d7d87" stroke-width="5"/>
  <circle cx="575" cy="115" r="10" fill="#efe6d7" stroke="#6d7d87" stroke-width="5"/>

  <path d="M340 350 Q398.75 350 457.5 291.25"
        fill="none" stroke="#b45532" stroke-width="11" stroke-linecap="round"
        marker-end="url(#arc-arrow)"/>
  <circle cx="340" cy="350" r="10" fill="#1f4e79"/>
</svg>
