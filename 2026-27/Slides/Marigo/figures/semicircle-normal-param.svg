<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" role="img" aria-labelledby="title desc">
<title id="title">Arco semicircolare percorso in senso antiorario</title><desc id="desc">Semicirconferenza superiore di raggio R, dal punto limite destro con zeta zero al punto limite sinistro con zeta pi. Al punto superiore zeta vale pi mezzi. Gli estremi sono esclusi.</desc>
<defs><marker id="arrow" markerWidth="15" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5L0 13" fill="#19364a"/></marker><marker id="orange" markerWidth="18" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 8L0 16" fill="#b45532"/></marker></defs>
<g fill="none" stroke="#19364a" stroke-width="3"><path d="M290 292L510 292" marker-end="url(#arrow)"/><path d="M290 292L290 50" marker-end="url(#arrow)"/><path d="M110 292A180 180 0 0 1 470 292" stroke="#1f4e79" stroke-width="5"/><path d="M426 174A180 180 0 0 0 370 131" stroke="#b45532" stroke-width="5" marker-end="url(#orange)"/><path d="M290 292L417 165" stroke="#6d7d87"/><path d="M341 292A51 51 0 0 0 326 256" stroke="#b45532"/></g>
<g fill="#f7f4ed" stroke="#1f4e79" stroke-width="3"><circle cx="110" cy="292" r="6"/><circle cx="470" cy="292" r="6"/></g><circle cx="290" cy="112" r="5" fill="#1f4e79"/>
<g fill="#19364a" font-family="Arial,sans-serif" font-size="25"><text x="272" y="321">O</text><text x="514" y="301">e₁</text><text x="299" y="51">e₂</text><text x="341" y="217">R</text><text x="346" y="274" fill="#b45532">ζ</text><text x="77" y="332">ζ → π</text><text x="429" y="332">ζ → 0</text><text x="301" y="95">ζ = π/2</text><text x="183" y="380" font-size="23" fill="#6d7d87">Estremi esclusi: ζ ∈ (0, π)</text></g>
</svg>
