<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
  <title id="title">Tangenti e normali alla parabola</title>
  <desc id="desc">Arco di parabola con tangente e normale orientata nel vertice e nel punto corrispondente al parametro un mezzo.</desc>
  <defs>
    <marker id="axis-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#244b62"/>
    </marker>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L13,5.5 L0,11 z" fill="#1f4e79"/>
    </marker>
    <marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L13,5.5 L0,11 z" fill="#3f7d63"/>
    </marker>
    <marker id="orange-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L13,5.5 L0,11 z" fill="#b45532"/>
    </marker>
    <marker id="purple-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L13,5.5 L0,11 z" fill="#77558a"/>
    </marker>
  </defs>

  <rect width="680" height="430" rx="18" fill="#efe6d7"/>

  <g fill="none" stroke="#244b62" stroke-width="4" stroke-linecap="round">
    <path d="M55 350 H630" marker-end="url(#axis-arrow)"/>
    <path d="M340 390 V35" marker-end="url(#axis-arrow)"/>
  </g>

  <path d="M105 115 Q340 585 575 115"
        fill="none" stroke="#6d7d87" stroke-width="8" stroke-linecap="round"/>
  <circle cx="105" cy="115" r="10" fill="#efe6d7" stroke="#6d7d87" stroke-width="5"/>
  <circle cx="575" cy="115" r="10" fill="#efe6d7" stroke="#6d7d87" stroke-width="5"/>

  <path d="M340 350 H465"
        fill="none" stroke="#1f4e79" stroke-width="7" stroke-linecap="round"
        marker-end="url(#blue-arrow)"/>
  <path d="M340 350 V225"
        fill="none" stroke="#3f7d63" stroke-width="7" stroke-linecap="round"
        marker-end="url(#green-arrow)"/>
  <circle cx="340" cy="350" r="10" fill="#1f4e79"/>

  <path d="M457.5 291.25 L560 188.75"
        fill="none" stroke="#b45532" stroke-width="7" stroke-linecap="round"
        marker-end="url(#orange-arrow)"/>
  <path d="M457.5 291.25 L355 188.75"
        fill="none" stroke="#77558a" stroke-width="7" stroke-linecap="round"
        marker-end="url(#purple-arrow)"/>
  <circle cx="457.5" cy="291.25" r="10" fill="#b45532"/>
</svg>
